<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DO NOT CLICK</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #screen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #boomButton {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 6px solid #8b0000;
      background: #ff0000;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;

      box-shadow:
        0 0 20px #ff0000,
        0 0 50px rgba(255, 0, 0, 0.7),
        inset 0 -15px 20px rgba(100, 0, 0, 0.5),
        inset 0 10px 15px rgba(255, 255, 255, 0.35);

      transition: transform 0.1s, box-shadow 0.1s;
    }

    #boomButton:hover {
      transform: scale(1.05);

      box-shadow:
        0 0 30px #ff0000,
        0 0 70px rgba(255, 0, 0, 0.8),
        inset 0 -15px 20px rgba(100, 0, 0, 0.5),
        inset 0 10px 15px rgba(255, 255, 255, 0.4);
    }

    #boomButton:active {
      transform: scale(0.92);
    }

    #message {
      position: absolute;
      color: white;
      font-size: 180px;
      font-weight: bold;
      text-align: center;

      text-shadow:
        0 0 20px white,
        0 0 50px orange,
        0 0 100px red;

      opacity: 0;
      pointer-events: none;
    }

    #resetButton {
      display: none;

      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);

      padding: 15px 35px;

      background: #00b83f;
      color: white;

      border: 3px solid #007a2a;
      border-radius: 12px;

      font-size: 22px;
      font-weight: bold;
      cursor: pointer;

      box-shadow:
        0 0 15px rgba(0, 255, 80, 0.5),
        inset 0 5px 10px rgba(255, 255, 255, 0.25);

      z-index: 1000;

      transition: transform 0.1s, background 0.1s;
    }

    #resetButton:hover {
      background: #00d94b;
      transform: translateX(-50%) scale(1.05);
    }

    #resetButton:active {
      transform: translateX(-50%) scale(0.95);
    }

    #credit {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);

      color: #777;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;

      z-index: 1001;
      pointer-events: none;
    }

    .exploding-letter {
      position: fixed;
      color: #777;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      z-index: 1001;
      white-space: pre;
      will-change: transform, opacity;
    }
  </style>
</head>

<body>

  <div id="screen">

    <button id="boomButton">DO NOT CLICK</button>

    <div id="message"></div>

    <button id="resetButton">GO BACK</button>

    <div id="credit">made by malek rami</div>

  </div>

  <script>
    const boomSound = new Audio(
      "daviddumaisaudio-large-underwater-explosion-190270.mp3"
    );

    boomSound.preload = "auto";

    const button = document.getElementById("boomButton");
    const message = document.getElementById("message");
    const resetButton = document.getElementById("resetButton");
    const credit = document.getElementById("credit");

    let clickCount = 0;

    window.addEventListener("load", () => {
      setTimeout(() => {
        speak("DO NOT CLICK");
      }, 300);
    });

    button.addEventListener("click", () => {

      clickCount++;

      if (clickCount === 1) {
        button.textContent = "DON'T PRESS ME AGAIN";
        speak(button.textContent);
        return;
      }

      if (clickCount === 2) {
        button.textContent = "SERIOUSLY NO";
        speak(button.textContent);
        return;
      }

      if (clickCount === 3) {

        button.style.display = "none";

        speak("Oh no.", () => {

          boomSound.currentTime = 0;
          boomSound.play();

          message.textContent = "💥";
          message.style.opacity = "1";

          const flash = document.createElement("div");

          flash.style.position = "fixed";
          flash.style.inset = "0";
          flash.style.background = "white";
          flash.style.pointerEvents = "none";
          flash.style.zIndex = "999";

          document.body.appendChild(flash);

          flash.animate(
            [
              { opacity: 1 },
              { opacity: 0 }
            ],
            {
              duration: 250,
              easing: "ease-out"
            }
          ).onfinish = () => flash.remove();

          document.body.animate(
            [
              { transform: "translate(0, 0)" },
              { transform: "translate(-15px, 10px)" },
              { transform: "translate(15px, -10px)" },
              { transform: "translate(-10px, -8px)" },
              { transform: "translate(10px, 8px)" },
              { transform: "translate(0, 0)" }
            ],
            {
              duration: 500,
              easing: "ease-out"
            }
          );

          const shockwave = document.createElement("div");

          shockwave.style.position = "fixed";
          shockwave.style.left = "50%";
          shockwave.style.top = "50%";
          shockwave.style.width = "40px";
          shockwave.style.height = "40px";
          shockwave.style.border = "8px solid white";
          shockwave.style.borderRadius = "50%";
          shockwave.style.transform = "translate(-50%, -50%)";
          shockwave.style.pointerEvents = "none";
          shockwave.style.zIndex = "10";

          document.body.appendChild(shockwave);

          shockwave.animate(
            [
              {
                width: "40px",
                height: "40px",
                opacity: 1
              },
              {
                width: "900px",
                height: "900px",
                opacity: 0
              }
            ],
            {
              duration: 700,
              easing: "ease-out"
            }
          ).onfinish = () => shockwave.remove();

          for (let i = 0; i < 180; i++) {
            explode();
          }

          explodeCredit();

          resetButton.style.display = "block";
        });
      }
    });

    function speak(text, callback) {

      const voice = new SpeechSynthesisUtterance(text);

      voice.rate = 0.9;
      voice.pitch = 0.7;
      voice.volume = 1;

      voice.onend = () => {
        if (callback) {
          callback();
        }
      };

      speechSynthesis.cancel();
      speechSynthesis.speak(voice);
    }

    function explodeCredit() {

      const text = credit.textContent;
      const rect = credit.getBoundingClientRect();

      // Completely hide the original credit.
      credit.style.display = "none";

      // Temporary element used to accurately measure every character.
      const measure = document.createElement("div");

      measure.style.position = "fixed";
      measure.style.left = "0";
      measure.style.top = "0";
      measure.style.visibility = "hidden";
      measure.style.whiteSpace = "nowrap";
      measure.style.fontFamily = getComputedStyle(credit).fontFamily;
      measure.style.fontSize = getComputedStyle(credit).fontSize;
      measure.style.fontWeight = getComputedStyle(credit).fontWeight;

      document.body.appendChild(measure);

      let currentX = rect.left;

      for (const character of text) {

        const measurement = document.createElement("span");

        measurement.textContent =
          character === " " ? "\u00A0" : character;

        measure.appendChild(measurement);

        const width =
          measurement.getBoundingClientRect().width;

        const letter = document.createElement("span");

        letter.className = "exploding-letter";

        letter.textContent =
          character === " " ? "\u00A0" : character;

        letter.style.left = `${currentX}px`;
        letter.style.top = `${rect.top}px`;

        document.body.appendChild(letter);

        /*
          Every letter gets its own random trajectory.

          The letters first stay visible for a tiny moment,
          then violently launch outward.
        */

        const angle =
          Math.random() * Math.PI * 2;

        const distance =
          Math.random() * 900 + 500;

        const x =
          Math.cos(angle) * distance;

        const y =
          Math.sin(angle) * distance;

        const rotation =
          Math.random() * 2400 - 1200;

        const duration =
          Math.random() * 1800 + 4200;

        const delay =
          Math.random() * 180;

        letter.animate(
          [
            {
              transform:
                "translate(0, 0) rotate(0deg) scale(1)",
              opacity: 1,
              offset: 0
            },

            {
              transform:
                "translate(0, 0) rotate(0deg) scale(1.15)",
              opacity: 1,
              offset: 0.06
            },

            {
              transform:
                `translate(${x * 0.25}px, ${y * 0.25}px)
                 rotate(${rotation * 0.25}deg)
                 scale(1.05)`,
              opacity: 1,
              offset: 0.25
            },

            {
              transform:
                `translate(${x * 0.65}px, ${y * 0.65}px)
                 rotate(${rotation * 0.65}deg)
                 scale(0.75)`,
              opacity: 0.8,
              offset: 0.65
            },

            {
              transform:
                `translate(${x}px, ${y}px)
                 rotate(${rotation}deg)
                 scale(0)`,
              opacity: 0,
              offset: 1
            }
          ],
          {
            duration: duration,
            delay: delay,
            easing: "cubic-bezier(.12,.75,.18,1)",
            fill: "forwards"
          }
        ).onfinish = () => {
          letter.remove();
        };

        currentX += width;
      }

      measure.remove();
    }

    function explode() {

      const particle = document.createElement("div");

      particle.style.position = "fixed";
      particle.style.left = "50%";
      particle.style.top = "50%";

      particle.style.width =
        `${Math.random() * 10 + 3}px`;

      particle.style.height =
        `${Math.random() * 10 + 3}px`;

      particle.style.background =
        Math.random() > 0.5 ? "orange" : "red";

      particle.style.borderRadius = "50%";
      particle.style.pointerEvents = "none";
      particle.style.zIndex = "20";

      document.body.appendChild(particle);

      const angle =
        Math.random() * Math.PI * 2;

      const distance =
        Math.random() * 600 + 100;

      const x =
        Math.cos(angle) * distance;

      const y =
        Math.sin(angle) * distance;

      particle.animate(
        [
          {
            transform:
              "translate(-50%, -50%) scale(1)",
            opacity: 1
          },
          {
            transform:
              `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0)`,
            opacity: 0
          }
        ],
        {
          duration:
            Math.random() * 1000 + 500,

          easing:
            "cubic-bezier(.1,.8,.2,1)"
        }
      ).onfinish = () => particle.remove();
    }

    resetButton.addEventListener("click", () => {

      speechSynthesis.cancel();

      boomSound.pause();
      boomSound.currentTime = 0;

      message.textContent = "";
      message.style.opacity = "0";

      resetButton.style.display = "none";

      button.style.display = "block";

      button.textContent = "DO NOT CLICK";

      credit.style.display = "block";
      credit.textContent = "made by malek rami";
      credit.style.opacity = "1";
      credit.style.transform = "translateX(-50%)";

      document
        .querySelectorAll(".exploding-letter")
        .forEach(letter => letter.remove());

      clickCount = 0;
    });
  </script>

</body>
</html>
